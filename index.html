<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자유의 여신상 | 헤드 트래킹 3D 돌출 착시</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101e;color:#eefaff;font-family:system-ui,"Malgun Gothic",sans-serif}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#hud{position:fixed;top:0;left:0;right:0;padding:15px 16px 30px;background:linear-gradient(#07101ef0,#07101e00);pointer-events:none;z-index:3}
h1{font-size:clamp(17px,4vw,25px);margin:0 0 7px}
#status{font-size:clamp(12px,3vw,15px);color:#c3e8ef;line-height:1.5;max-width:850px}
#actions{position:fixed;bottom:calc(34px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;z-index:5;width:min(1100px,98vw)}
button{background:#134e68;color:white;border:1px solid #8ceaf5;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
button:disabled{opacity:.5}
#start{background:#087b66}
#pop{background:#087b66}
#normal{background:#134e68}
button.selected{outline:2px solid #7cf9cf;box-shadow:0 0 16px #03e1b266}
#depthControl{display:flex;gap:7px;align-items:center;background:#071f32db;padding:7px 10px;border:1px solid #245b70;border-radius:10px;font-size:12px;white-space:nowrap}
#depth{width:110px;accent-color:#36cfff}
#portal{position:fixed;inset:19% 19% 17%;border:5px solid #4cbaff;box-shadow:0 0 12px #1e9fff,0 0 30px #0c65ca,inset 0 0 17px #1e9fff;transform:perspective(1100px) rotateY(-9deg) rotateX(3deg);pointer-events:none;z-index:2;opacity:.88}
#portal:before{content:"";position:absolute;inset:0;border:10px solid #07101e8c;box-shadow:inset 0 0 35px #03101c}
#portal.normal{opacity:.3;transform:none}
#floor{position:fixed;left:0;right:0;bottom:0;height:32%;pointer-events:none;z-index:1;opacity:.5;background:linear-gradient(0deg,#061d38bb,transparent),repeating-linear-gradient(90deg,transparent 0 12%,#1686bd55 calc(12% + 1px),transparent calc(12% + 2px) 24%);clip-path:polygon(0 100%,100% 100%,72% 0,28% 0)}
#torchGlow{position:fixed;width:180px;height:180px;left:25%;top:14%;border-radius:50%;background:radial-gradient(circle,#fff1b47a 0%,#ffa50055 17%,#ff7b0020 43%,transparent 70%);filter:blur(9px);mix-blend-mode:screen;pointer-events:none;z-index:3}
@media(max-width:700px){#portal{inset:24% 10% 24%;border-width:3px}#actions{bottom:calc(38px + env(safe-area-inset-bottom))}button{font-size:11px;padding:9px}#depth{width:75px}#torchGlow{width:110px;height:110px}}
#stop{display:none}
#video{position:fixed;right:12px;top:105px;width:105px;max-width:24vw;aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1);border:1px solid #67d6e6;border-radius:8px;z-index:4;display:none;opacity:.75}
#badge{position:fixed;right:12px;top:90px;color:#b1cdd9;font-size:10px;z-index:4}
#footer{position:fixed;bottom:calc(3px + env(safe-area-inset-bottom));left:6px;right:6px;text-align:center;font-size:10px;color:#91b4c2;pointer-events:none;z-index:4}
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:18px 22px;border:1px solid #4f90a9;background:#081b2de8;border-radius:12px;z-index:6;display:none;text-align:center}
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div><div id="floor"></div><div id="portal"></div><div id="torchGlow"></div>
<div id="hud"><h1>🗽 자유의 여신상 | 헤드 트래킹 3D 돌출 착시</h1><div id="status">3D 모델을 불러오는 중입니다…</div></div>
<div id="badge">3D 모델: tech.service.allwe · CC BY 4.0</div>
<video id="video" autoplay muted playsinline></video>
<div id="actions"><button id="start" disabled>📷 얼굴 추적 시작</button><button id="stop">■ 얼굴 추적 종료</button><button id="reset">시점 초기화</button><button id="pop" class="selected">▣ 돌출 착시 모드</button><button id="normal">◉ 일반 3D 모드</button><label id="depthControl">돌출 정도 <input id="depth" type="range" min="0" max="100" value="75"><span id="depthValue">75</span></label></div>
<div id="footer">실제 화면 밖 투영이 아닌 3D 원근·가상 창틀·얼굴 추적을 결합한 돌출 착시 시뮬레이션입니다.</div>
<div id="hint"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
// 얼굴 인식 모듈은 시작 버튼을 누를 때만 동적으로 불러옵니다.
const VISION_VERSION='0.10.14';
const $=id=>document.getElementById(id);
const stage=$('stage'),status=$('status'),start=$('start'),stop=$('stop'),reset=$('reset'),video=$('video');
const pop=$('pop'),normal=$('normal'),depth=$('depth'),depthValue=$('depthValue'),portal=$('portal'),torchGlow=$('torchGlow');
let popMode=true,depthAmount=.75,wrapper=null;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101e);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,30);
const light=new THREE.HemisphereLight(0xffffff,0x486b85,2.2);scene.add(light);
const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(-.6,1.2,1.8);scene.add(key);
const rim=new THREE.DirectionalLight(0x54cfff,1.1);rim.position.set(.8,.6,-.6);scene.add(rim);

// 화면을 '창'으로 간주: z=0이 창틀, z<0은 창 뒤, z>0은 창 앞.
const root=new THREE.Group();scene.add(root);
const windowFrame=new THREE.Group();scene.add(windowFrame);
const frameMaterial=new THREE.MeshBasicMaterial({color:0x43d9e8,transparent:true,opacity:.65});
const gridMaterial=new THREE.LineBasicMaterial({color:0x1c7b95,transparent:true,opacity:.33});
const bar=(a,b)=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]);windowFrame.add(new THREE.Line(g,frameMaterial));};
let screenH=.9,screenW=screenH*innerWidth/innerHeight;
function rebuildFrame(){
 while(windowFrame.children.length){const o=windowFrame.children[0];windowFrame.remove(o);o.geometry.dispose();}
 screenW=screenH*innerWidth/innerHeight;
 const x=screenW*.48,y=screenH*.46;
 for(let i=0;i<4;i++){
  const p=[[ -x,-y,0],[x,-y,0],[x,y,0],[-x,y,0]];
  bar(p[i],p[(i+1)%4]);
 }
 // 창 뒤쪽 공간을 알려주는 얇은 선들
 for(let z of [-.22,-.48]){
  for(let i=0;i<=6;i++){
   const xx=-x+2*x*i/6;
   const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xx,-y,z),new THREE.Vector3(xx,-y,0)]);
   windowFrame.add(new THREE.Line(g,gridMaterial));
  }
 }
}
rebuildFrame();
const plinth=new THREE.Mesh(new THREE.CylinderGeometry(.17,.19,.02,64),new THREE.MeshStandardMaterial({color:0x0d667c,emissive:0x043343,metalness:.5,roughness:.5}));
plinth.position.set(0,-.355,-.17);root.add(plinth);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.18,.005,8,72),new THREE.MeshBasicMaterial({color:0x32d5ff}));
ring.rotation.x=Math.PI/2;ring.position.set(0,-.342,-.17);root.add(ring);
const gltf=new GLTFLoader();
let modelReady=false,tracking=false,stream=null,detector=null,timer=null;
let targetX=0,targetY=0,eyeX=0,eyeY=0;
const eyeZ=1.2; // 가상 눈에서 화면까지 거리
let faceSeen=0, framesSent=0, framesReturned=0, lastError="", nativeDetector=null, busy=false;
const faceReadout=document.createElement("div");faceReadout.id="faceReadout";faceReadout.style.cssText="position:fixed;top:195px;right:12px;background:#062c3acc;border:1px solid #4ab7c7;border-radius:8px;padding:7px 9px;font-size:12px;z-index:5;max-width:230px";faceReadout.textContent="얼굴 좌표: 대기 중";document.body.appendChild(faceReadout);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

function applyMode(){
 if(!wrapper)return;
 // v5의 정상 작동하는 얼굴 추적 코드는 그대로 두고 모델 연출만 전환합니다.
 // 여신상 자체를 기울여 횃불이 관람자를 향하도록 배치합니다.
 if(popMode){
  wrapper.scale.setScalar((.92+depthAmount*.27)/modelHeight);
  wrapper.rotation.set(-.12-depthAmount*.32,-.40-depthAmount*.22,-.23-depthAmount*.12);
  wrapper.position.set(.04,-.39,-.12+depthAmount*.13);
 }else{
  wrapper.scale.setScalar(.66/modelHeight);
  wrapper.rotation.set(0,0,0);
  wrapper.position.set(0,-.34,-.17);
 }
 portal.classList.toggle('normal',!popMode);
 torchGlow.style.display=popMode?'block':'none';
 pop.classList.toggle('selected',popMode);normal.classList.toggle('selected',!popMode);
}
let modelHeight=1;
pop.onclick=()=>{popMode=true;applyMode();status.textContent='돌출 착시 모드: 횃불이 가상 창틀 앞으로 나오는 구도입니다.';};
normal.onclick=()=>{popMode=false;applyMode();status.textContent='일반 3D 모드: 자유의 여신상 전체를 감상합니다.';};
depth.oninput=()=>{depthAmount=Number(depth.value)/100;depthValue.textContent=depth.value;applyMode();};

gltf.load('./statue_of_liberty_1.glb',g=>{
 const obj=g.scene;
 obj.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(obj);
 const sz=bounds.getSize(new THREE.Vector3()),mid=bounds.getCenter(new THREE.Vector3());
 if(!sz.y||!Number.isFinite(sz.y)){status.textContent='모델 크기를 계산할 수 없습니다.';return;}
 // 여신상 높이를 0.66m의 가상 단위로 정규화
 obj.position.set(-mid.x,-bounds.min.y,-mid.z);
 modelHeight=sz.y;wrapper=new THREE.Group();
 wrapper.add(obj);root.add(wrapper);
 applyMode();
 modelReady=true;start.disabled=false;
 status.textContent='돌출 착시 준비 완료. 얼굴 추적을 시작하거나 마우스로 시점을 움직여 보세요.';
},undefined,e=>{
 console.error(e);status.textContent='모델을 불러오지 못했습니다. statue_of_liberty_1.glb 파일이 같은 폴더에 있는지 확인하세요.';
});
function updatePerspective(){
 // 비대칭 원근 투영: 실제 눈의 위치에서 고정된 창(z=0)을 보는 방식
 const near=.03;
 const left=(-screenW/2-eyeX)*near/eyeZ;
 const right=(screenW/2-eyeX)*near/eyeZ;
 const bottom=(-screenH/2-eyeY)*near/eyeZ;
 const top=(screenH/2-eyeY)*near/eyeZ;
 camera.position.set(eyeX,eyeY,eyeZ);
 camera.rotation.set(0,0,0);
 camera.projectionMatrix.makePerspective(left,right,top,bottom,near,30);
 camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}
let drag=false,lastX=0,lastY=0;
stage.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{
 if(!drag||tracking)return;
 targetX=clamp(targetX+(e.clientX-lastX)/innerWidth*.9,-.48,.48);
 targetY=clamp(targetY-(e.clientY-lastY)/innerHeight*.55,-.3,.3);
 lastX=e.clientX;lastY=e.clientY;
});
stage.addEventListener('pointerup',()=>drag=false);
stage.addEventListener('pointercancel',()=>drag=false);
reset.addEventListener('click',()=>{targetX=targetY=0;eyeX=eyeY=0;status.textContent=tracking?'얼굴 추적 중입니다. 머리를 좌우로 움직여 보세요.':'시점을 초기화했습니다. 마우스 드래그로 시점을 바꿔 보세요.';});
function applyFace(p){
 const px=p.x,py=p.y;
 targetX=clamp((.5-px)*2.0,-.65,.65);
 targetY=clamp((.5-py)*1.15,-.38,.38);
 faceSeen++;
 faceReadout.textContent=`얼굴 감지 ${faceSeen}회 | x=${px.toFixed(2)} y=${py.toFixed(2)} | 시점 X=${targetX.toFixed(2)} Y=${targetY.toFixed(2)}`;
 status.textContent='얼굴 좌표 인식 성공. 머리를 좌우·상하로 움직여 보세요.';
}
async function detectionLoop(){
 if(!tracking)return;
 if(video.readyState<2){timer=setTimeout(detectionLoop,200);return;}
 framesSent++;
 try{
  const result=detector.detectForVideo(video,performance.now());
  framesReturned++;
  const d=result.detections?.[0];
  if(d){
   const b=d.boundingBox;
   applyFace({x:(b.originX+b.width/2)/video.videoWidth,y:(b.originY+b.height/2)/video.videoHeight});
  }else faceReadout.textContent=`얼굴 미검출 · 분석 ${framesReturned}회`;
 }catch(e){
  lastError=e.message||String(e);
  faceReadout.textContent='인식 오류: '+lastError;
  status.textContent='얼굴 인식 엔진 오류. 오른쪽 메시지를 확인하세요.';
  console.error(e);
  stopTracking(true);return;
 }
 if(tracking)timer=setTimeout(detectionLoop,130);
}
start.onclick=async()=>{
 if(!modelReady)return;
 if(!navigator.mediaDevices?.getUserMedia){status.textContent='HTTPS 환경과 카메라 권한을 확인하세요.';return;}
 start.disabled=true;status.textContent='전면 카메라를 연결하는 중입니다…';
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  video.srcObject=stream;await video.play();video.style.display='block';
  faceReadout.textContent='새 얼굴 인식 엔진(MediaPipe Tasks) 로딩 중…';
  const {FaceDetector: MPFaceDetector, FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+VISION_VERSION+'/+esm');
  const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+VISION_VERSION+'/wasm');
  detector=await MPFaceDetector.createFromOptions(fileset,{
   baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},
   runningMode:'VIDEO',minDetectionConfidence:.45
  });
  tracking=true;start.style.display='none';stop.style.display='inline-block';
  status.textContent='얼굴 인식 엔진 준비 완료. 얼굴을 찾고 있습니다…';
  detectionLoop();
 }catch(e){
  console.error(e);status.textContent='얼굴 인식 엔진 시작 실패: '+(e.message||String(e));
  faceReadout.textContent='시작 오류: '+(e.message||String(e));
  stopTracking(true);
 }
};
function stopTracking(preserveError=false){
 tracking=false;clearTimeout(timer);timer=null;
 if(detector){try{detector.close();}catch(e){}detector=null;}
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 video.pause();video.srcObject=null;video.style.display='none';
 start.style.display='inline-block';stop.style.display='none';start.disabled=!modelReady;
 targetX=targetY=0;
 if(!preserveError)faceReadout.textContent='얼굴 좌표: 추적 종료';
 framesSent=framesReturned=0;
}
stop.onclick=()=>{stopTracking();status.textContent='얼굴 추적을 종료했습니다. 마우스 드래그로 시점을 바꿀 수 있습니다.';};
function draw(){
 requestAnimationFrame(draw);
 eyeX+=(targetX-eyeX)*.14;
 eyeY+=(targetY-eyeY)*.14;
 // 단안 원근 효과가 작은 화면에서도 드러나도록 모델에 약한 시차 회전을 추가합니다.
 // 실제 헤드 트래킹 원근과 시각적 강조 연출을 함께 적용한 교육용 데모입니다.
 root.rotation.y=eyeX*.65;
 root.rotation.x=-eyeY*.42;
 // 횃불 빛무리 위치는 화면 좌표에 따라 자연스럽게 조금 이동합니다.
 if(popMode){torchGlow.style.left=(26-eyeX*17)+"%";torchGlow.style.top=(12+eyeY*15)+"%";}
 updatePerspective();
 ring.rotation.z+=.003;
 renderer.render(scene,camera);
}
draw();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);rebuildFrame();});
addEventListener('pagehide',stopTracking);
</script>
</body>
</html>
